# reBot 机械臂关节电机配置
#
# 字段说明：
#   name      : 关节名称（唯一标识，代码中通过 arm["joint1"] 访问）
#   type      : 电机型号，支持的值：
#                 DM4310 / DM4310_48V / DM4340 / DM4340_48V
#                 DM6006 / DM6248P / DM8006 / DM8009
#                 DM10010L / DM10010 / DMH3510 / DMH6215 / DMG6220 / DMJH11
#   slave_id  : 电机 CAN ID（ESC_ID），十六进制
#   master_id : 主机 CAN ID（MST_ID），十六进制
#   mit_kp    : MIT 阻抗控制位置增益（set_position 时使用）
#   mit_kd    : MIT 阻抗控制速度增益（set_position 时使用）
#
# 新增电机：在 joints 列表末尾追加一行即可，无需修改任何 C++ 代码。

joints:
  - name:      joint1
    type:      DM4310
    slave_id:  0x01
    master_id: 0x11
    mit_kp:    5.0
    mit_kd:    0.15

  - name:      joint2
    type:      DM4340
    slave_id:  0x02
    master_id: 0x12
    mit_kp:    5.0
